          - name: title
            label: SEO title
            type: string
            required: true
            options:
              maxlength: 65
          - name: description
            label: Meta description
            type: text
            required: true
            options:
              maxlength: 170
          - name: canonical
            label: Canonical URL
            type: string
            required: true
          - name: keywords
            label: Target keywords
            type: string
            list: true
