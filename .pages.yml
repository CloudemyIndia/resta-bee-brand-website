media:
  path: public/cms-media
  input: public/cms-media
  output: /cms-media

content:
  - name: marketing-pages
    label: Marketing pages
    type: collection
    path: src/content/pages
    filename: "{primary}.json"
    format: json
    subfolders: false
    view:
      primary: pageId
    fields:
      - name: pageId
        label: Page identifier
        type: string
        readonly: true
        required: true
      - name: seo
        label: Search and social metadata
        type: object
